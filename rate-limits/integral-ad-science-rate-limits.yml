note: >-
  Integral Ad Science documents no rate limits, no quotas and no throttling
  behaviour for the Reporting API, and returns no rate-limit headers on the
  responses observable without credentials. An agent calling this API has no
  runtime signal telling it how hard it may poll — which matters more than usual
  here, because the API is job-oriented and the ONLY documented way to learn a
  report is finished is to poll GET /report-status in a loop with no documented
  interval.
