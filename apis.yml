apis:
  - name: IAS Reporting API
    description: >-
      RESTful API that exposes IAS viewability, fraud and brand safety metrics
      for a customer's own business applications. Job-oriented: POST /report
      submits a JSON ReportRequest describing teams, date range, report type,
      metrics and dimensions; GET /report-status polls for completion; GET
      /report-download retrieves the CSV. GET /report-dimensions/{teams,
      mediapartners, campaigns, placements} enumerates the dimension values a
      caller is entitled to. Thirteen report families are documented, including
      Performance, Brand Suitability Failure, Facebook, YouTube, TikTok,
      Collision, Geo Compliance, Domain Mismatch, Total Visibility and
      Attention. Authentication is OAuth 2.0 password grant against
      data.integralplatform.com/auth/uaa/oauth/token; client credentials are
      issued by an IAS representative.
    humanURL: https://helpcenter.integralplatform.com/article/developers-center
    baseURL: https://data.integralplatform.com
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/integral-ad-science.png
    tags:
      - Ad Verification
      - Ad Measurement
      - Reporting
      - Analytics
      - Viewability
      - Brand Safety
      - Ad Fraud
