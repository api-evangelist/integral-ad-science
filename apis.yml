  detail: >-
    Integral Ad Science runs a real, live REST API estate — data.integralplatform.com
    answers a bearer request with the documented OAuth error "invalid_token: Access
    token expired" — but between 2024 and 2026 IAS moved every developer article
    (reporting-api, segment-api-guide, custom-segment-retrieval-api-guide,
    multimedia-classification-api, gaming-api, admantx-api-guide, auto-tag-light-api,
    partner-measurement-api-implementation-guide) behind the IAS Signal customer
    login, leaving only a Developers Center index page that renders with
    requiredRoles ["loggedIn"] and serves an empty body to anonymous clients.
