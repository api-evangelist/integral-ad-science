compliance_summary: >-
  SOC 2 Type 2, ISO/IEC 27001:2022 and a broad MRC accreditation portfolio are
  published with named scopes in a public trust center. API-standards
  conformance is the opposite picture: no OpenAPI, no RFC 9457, no
  discoverability documents, and an OAuth flow the current BCP deprecates.
